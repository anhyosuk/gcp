    let activeSpeaker = null;

    let partnerTransLang = 'tl';
    let partnerTTSLang = 'tl-P    let partnerTTSLang = 'tl-P    let partnerTTSLang = 'tl-P    let partnerTTSLang = 'tl-P    let partus    let partnerTTSLang = 'tl-P    let partnerTTSLang = 'tl-P    let partnerTTSLang = 'tl-P    let partnerTTSLang =.value.split('|');

      userTTSLang = uVal[1];

    function toggleSpeed(speaker) {
      if (speaker === 'partner') {
        partnerSpeed = partnerSpeed === 1.0 ? 0.8 : 1.0;
        document.getElementById('partner-speed-btn').innerText = `속도: ${partnerSpeed}x`;
      } else {
        userSpeed = userSpeed === 1.0 ? 0.8 : 1.0;
        document.getElementById('user-speed-btn').innerText = `속도: ${userSpeed}x`;
      }
    }

    async function initAudioPermissions() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("HTTPS 보안 연결이 필요합니다.");
        }
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(track => track.stop());
        document.getElementById('permissionOverlay').style.display = 'none';
      } catch (err) {
        alert("마이크 권한이 필요합니다: " + err.message);
      }
    }

    function handleZoneTap(event, speaker) {
      // 폼 컨트롤, 버튼 클릭 시 배경 녹음 방지
      if (['INPUT', 'BUTTON', 'SELECT'].includes(event.target.tagName)) return;

      if (recognition && activeSpeaker === speaker) {
        recognition.stop();
        return;
      }
      if (recognition) {
        recognition.abort();
      }

      const lang = speaker === 'user' ? userTTSLang : partnerTTSLang;
      startListening(lang, speaker);
    }

    function startListening(lang, speaker) {
      if (!SpeechRecognition) {
        alert("음성 인식을 지원하지 않는 브라우저입니다. Safari 또는 Chrome을 이용해 주세요.");
        return;
      }

      try {
        recognition = new SpeechRecognition();
        activeSpeaker = speaker;
        recognition.lang = lang;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        const zone = document.getElementById(`${speaker}-zone`);
        const badge = document.getElementById(`${speaker}-badge`);

        zone.classList.add('recording');
        badge.innerText = "듣는 중... (터치 시 완료)";

        recognition.onresult = async (event) => {
          const transcript = event.results[0][0].transcript;
          await processTranslation(transcript, speaker);
        };

        recognition.onerror = (event) => {
          console.error("Speech Recognition Error:", event.error);
        };

        recognition.onend = () => {
          zone.classList.remove('recording');
          badge.innerText = "터치하여 말하기";
          recognition = null;
          activeSpeaker = null;
        };

        recognition.start();
      } catch (e) {
        console.error("Recognition Start Error:", e);
      }
    }

    async function processTranslation(text, speaker) {
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if (speaker === 'user') {
        const translated = await translate(text, userTransLang, partnerTransLang);
        appendMessageCard('partner-messages', translated, text, timeStr, true, partnerTTSLang, partnerSpeed);
        appendMessageCard('user-messages', text, translated, timeStr, false, userTTSLang, userSpeed);
        playTTS(translated, partnerTTSLang, partnerSpeed);
      } else {
        const translated = await translate(text, partnerTransLang, userTransLang);
        appendMessageCard('user-messages', translated, text, timeStr, true, userTTSLang, userSpeed);
        appendMessageCard('partner-messages', text, translated, timeStr, false, partnerTTSLang, partnerSpeed);
        playTTS(translated, userTTSLang, userSpeed);
      }
    }

    function appendMessageCard(containerId, mainText, subText, time, isPartnerCard, ttsLang, speed) {
      const container = document.getElementById(containerId);
      const card = document.createElement('div');
      card.className = 'msg-card' + (isPartnerCard ? ' partner-side' : '');
      
      const escapedText = mainText.replace(/'/g, "\\'");
      card.innerHTML = `
        <div class="msg-trans">${mainText}</div>
        <div class="msg-orig">${subText}</div>
        <div class="msg-footer">
          <button class="replay-btn" onclick="event.stopPropagation(); playTTS('${escapedText}', '${ttsLang}', ${speed})">다시 듣기</button>
          <span class="msg-time">${time}</span>
        </div>
      `;
      container.appendChild(card);
      container.scrollTop = container.scrollHeight;
    }

    async function sendQuickPhrase(phrase) {
      await processTranslation(phrase, 'user');
    }

    function handleEnter(event, speaker) {
      if (event.key === 'Enter') {
        handleDirectSend(speaker);
      }
    }

    async function handleDirectSend(speaker) {
      const inputEl = document.getElementById(`${speaker}-input`);
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';
      await processTranslation(text, speaker);
    }

    async function translate(text, sl, tl) {
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        return data[0].map(item => item[0]).join('');
      } catch (err) {
        return "[번역 오류] " + text;
      }
    }

    function playTTS(text, lang, speed = 1.0) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      utterance.rate = speed;
      window.speechSynthesis.speak(utterance);
    }
  </script>
