<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Face-to-Face Translator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* 모바일 동적 뷰포트 높이 */
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
    }
    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
    }

    /* 상단 영역: 상대방 (180도 회전) */
    .screen-partner {
      flex: 1;
      height: 50dvh;
      background-color: #f8fafc;
      transform: rotate(180deg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      position: relative;
    }

    /* 중앙 구분선 */
    .divider {
      height: 2px;
      background-color: #cbd5e1;
      position: relative;
      z-index: 10;
    }

    /* 하단 영역: 본인 (정방향) */
    .screen-user {
      flex: 1;
      height: 50dvh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
    }

    .lang-badge {
      background-color: #e2e8f0;
      color: #1e293b;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .status-text {
      font-size: 12px;
      color: #0284c7;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 10px 0;
    }

    .trans-text {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.4;
      word-break: keep-all;
      margin-bottom: 8px;
      max-height: 100px;
      overflow-y: auto;
    }

    .orig-text {
      font-size: 14px;
      color: #94a3b8;
      min-height: 18px;
    }

    .btn-area {
      display: flex;
      justify-content: center;
      padding-bottom: 8px;
    }

    .action-btn {
      width: 100%;
      max-width: 280px;
      height: 52px;
      border: none;
      border-radius: 26px;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
    }

    .action-btn.active {
      background-color: #dc2626;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
    }

    /* 권한 요청 모달/알림 배너 */
    .permission-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: #ffffff;
      text-align: center;
    }

    .permission-btn {
      margin-top: 16px;
      padding: 14px 28px;
      background-color: #3b82f6;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .debug-log {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.7);
      color: #f8fafc;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>

  <!-- 초기 마이크 권한 요청 안내 화면 -->
  <div id="permissionOverlay" class="permission-overlay">
    <h3 style="margin-bottom: 8px;">대면 번역기 시작하기</h3>
    <p style="font-size: 14px; color: #cbd5e1; line-height: 1.5;">
      스마트폰을 테이블 중앙에 놓고 사용하세요.<br>
      정상적인 대화 인식을 위해 마이크 권한이 필요합니다.
    </p>
    <button class="permission-btn" onclick="initAudioPermissions()">마이크 권한 허용 및 시작</button>
  </div>

  <div class="app-container">
    <!-- 상단: 상대방 화면 (180도 반전) -->
    <div class="screen-partner">
      <div class="top-bar">
        <span class="lang-badge">상대방 (Tagalog)</span>
        <span class="status-text" id="partner-status">대기 중</span>
      </div>
      <div class="content-area">
        <div class="trans-text" id="partner-trans">Kamusta!</div>
        <div class="orig-text" id="partner-orig">들리는 말 (한국어)</div>
      </div>
      <div class="btn-area">
        <button class="action-btn" id="partner-btn" onclick="toggleSpeech('tl-PH', 'partner')">
          말하기 (Tagalog)
        </button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 하단: 본인 화면 (정방향) -->
    <div class="screen-user">
      <div class="top-bar">
        <span class="lang-badge">본인 (한국어)</span>
        <span class="status-text" id="user-status">대기 중</span>
      </div>
      <div class="content-area">
        <div class="trans-text" id="user-trans">안녕하세요!</div>
        <div class="orig-text" id="user-orig">상대방 음성 원문</div>
      </div>
      <div class="btn-area">
        <button class="action-btn" id="user-btn" onclick="toggleSpeech('ko-KR', 'user')">
          말하기 (한국어)
        </button>
      </div>
    </div>
  </div>

  <div id="debugLog" class="debug-log">준비됨</div>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let activeSpeaker = null;

    function setDebug(msg) {
      document.getElementById('debugLog').innerText = msg;
    }

    // 마이크 시스템 권한 팝업 트리거
    async function initAudioPermissions() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("HTTPS 보안 연결 또는 지원 브라우저가 필요합니다.");
        }
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        // 권한 획득 즉시 스트림 해제 (SpeechRecognition과 충돌 방지)
        stream.getTracks().forEach(track => track.stop());

        // 오버레이 닫기
        document.getElementById('permissionOverlay').style.display = 'none';
        setDebug("마이크 사용 가능");
      } catch (err) {
        alert("마이크 권한을 허용해야 번역기를 사용할 수 있습니다: " + err.message);
        setDebug("권한 오류: " + err.name);
      }
    }

    function toggleSpeech(lang, speaker) {
      if (!SpeechRecognition) {
        alert("현재 브라우저는 음성 인식을 지원하지 않습니다. 아이폰은 Safari, 안드로이드는 Chrome을 이용해 주세요.");
        return;
      }

      if (recognition && activeSpeaker === speaker) {
        recognition.stop();
        return;
      }

      if (recognition) {
        recognition.abort();
      }

      try {
        recognition = new SpeechRecognition();
        activeSpeaker = speaker;
        recognition.lang = lang;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        const btn = document.getElementById(`${speaker}-btn`);
        const status = document.getElementById(`${speaker}-status`);

        btn.classList.add('active');
        btn.innerText = "듣고 있습니다...";
        status.innerText = "음성 듣는 중";
        setDebug(speaker + " 음성 인식 중...");

        recognition.onresult = async (event) => {
          const text = event.results[0][0].transcript;
          setDebug("인식 완료: " + text);
          await processTranslation(text, speaker);
        };

        recognition.onerror = (event) => {
          setDebug("오류: " + event.error);
          status.innerText = "오류: " + event.error;
        };

        recognition.onend = () => {
          btn.classList.remove('active');
          btn.innerText = speaker === 'user' ? "말하기 (한국어)" : "말하기 (Tagalog)";
          status.innerText = "대기 중";
          recognition = null;
          activeSpeaker = null;
        };

        recognition.start();
      } catch (e) {
        setDebug("시작 오류: " + e.message);
      }
    }

    async function processTranslation(text, speaker) {
      if (speaker === 'user') {
        document.getElementById('partner-orig').innerText = text;
        const result = await translate(text, 'ko', 'tl');
        document.getElementById('partner-trans').innerText = result;
        playTTS(result, 'tl-PH');
      } else {
        document.getElementById('user-orig').innerText = text;
        const result = await translate(text, 'tl', 'ko');
        document.getElementById('user-trans').innerText = result;
        playTTS(result, 'ko-KR');
      }
    }

    async function translate(text, sl, tl) {
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        return data[0].map(item => item[0]).join('');
      } catch (err) {
        return "[번역 실패] " + text;
      }
    }

    function playTTS(text, lang) {
      if (!window.speechSynthesis) return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
