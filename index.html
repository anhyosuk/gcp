<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Face-to-Face Travel Translator</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 3단 CSS Grid (상단 1fr - 중앙 42px - 하단 1fr) */
    .app-grid {
      display: grid;
      grid-template-rows: 1fr 42px 1fr;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    /* 공통 패널 */
    .panel {
      display: flex;
      flex-direction: column;
      padding: 8px 12px;
      overflow: hidden;
      min-height: 0;
      position: relative;
      cursor: pointer;
    }

    /* 상단: 상대방 (180도 회전) */
    .partner-panel {
      grid-row: 1;
      background-color: #f8fafc;
      transform: rotate(180deg);
      border-bottom: 1px solid #cbd5e1;
    }

    /* 중앙: 광고 배너 영역 */
    .ad-slot {
      grid-row: 2;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      border-top: 1px solid #334155;
      border-bottom: 1px solid #334155;
    }
    .ad-box {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      border: 1px dashed #475569;
      padding: 4px 16px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    /* 하단: 본인 (정방향) */
    .user-panel {
      grid-row: 3;
      background-color: #ffffff;
      border-top: 1px solid #cbd5e1;
    }

    /* 녹음 중 활성화 펄스 효과 */
    .panel.recording {
      background-color: #fef2f2 !important;
      box-shadow: inset 0 0 0 3px #ef4444;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: inset 0 0 0 3px rgba(239, 68, 68, 0.8); }
      50% { box-shadow: inset 0 0 0 5px rgba(239, 68, 68, 0.3); }
      100% { box-shadow: inset 0 0 0 3px rgba(239, 68, 68, 0.8); }
    }

    /* 헤더 컨트롤 바 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      height: 30px;
      margin-bottom: 4px;
      gap: 6px;
    }

    .select-lang {
      font-size: 12px;
      font-weight: bold;
      color: #0f172a;
      padding: 3px 6px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      outline: none;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-speed {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      color: #475569;
      cursor: pointer;
    }

    .badge-status {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 10px;
      background-color: #e2e8f0;
      color: #475569;
      white-space: nowrap;
    }
    .recording .badge-status {
      background-color: #ef4444;
      color: #ffffff;
    }

    /* 대화 히스토리 스크롤 컨테이너 */
    .chat-scroll {
      flex: 1 1 0%;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px 0;
      -webkit-overflow-scrolling: touch;
    }

    .card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .partner-panel .card {
      background-color: #f1f5f9;
    }

    .txt-trans {
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.35;
      word-break: keep-all;
    }
    .txt-orig {
      font-size: 12px;
      color: #64748b;
      margin-top: 3px;
    }
    .card-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding-top: 4px;
      border-top: 1px dashed rgba(0,0,0,0.06);
    }
    .btn-replay {
      font-size: 10px;
      font-weight: 600;
      background-color: #e2e8f0;
      border: none;
      padding: 2px 7px;
      border-radius: 4px;
      cursor: pointer;
      color: #1e293b;
    }
    .txt-time {
      font-size: 9px;
      color: #94a3b8;
    }

    /* 하단 텍스트 입력창 */
    .input-row {
      display: flex;
      gap: 6px;
      padding-top: 6px;
      flex-shrink: 0;
      height: 36px;
    }
    .text-box {
      flex: 1;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 18px;
      border: 1px solid #cbd5e1;
      outline: none;
      background-color: #ffffff;
    }
    .btn-send {
      font-size: 11px;
      font-weight: 700;
      padding: 0 14px;
      border-radius: 18px;
      border: none;
      background-color: #2563eb;
      color: #ffffff;
      cursor: pointer;
    }

    /* 초기 권한 오버레이 */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #ffffff;
      text-align: center;
    }
    .btn-start {
      margin-top: 16px;
      padding: 12px 26px;
      background-color: #2563eb;
      border: none;
      border-radius: 20px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 권한 안내 화면 -->
  <div id="overlay" class="overlay">
    <h2 style="font-size: 18px; margin-bottom: 8px;">대면 여행 통역기</h2>
    <p style="font-size: 13px; color: #cbd5e1; line-height: 1.5;">
      스마트폰을 테이블 중앙에 평평히 놓으세요.<br>
      각 영역의 빈 공간을 <strong>터치</strong>하여 대화합니다.
    </p>
    <button class="btn-start" onclick="initMic()">마이크 허용 및 시작</button>
  </div>

  <div class="app-grid">
    <!-- 상단: 상대방 영역 (180도 반전) -->
    <div class="panel partner-panel" id="partner-panel" onclick="onPanelTap(event, 'partner')">
      <div class="header-bar" onclick="event.stopPropagation()">
        <select id="partner-lang" class="select-lang" onchange="onLanguageChange('partner')">
          <option value="tl|tl-PH" selected>필리핀 (Tagalog)</option>
          <option value="en|en-US">미국/공용 (English)</option>
          <option value="ja|ja-JP">일본 (日本語)</option>
          <option value="vi|vi-VN">베트남 (Tiếng Việt)</option>
          <option value="th|th-TH">태국 (ภาษาไทย)</option>
          <option value="es|es-ES">스페인 (Español)</option>
          <option value="zh-CN|zh-CN">중국 (中文)</option>
          <option value="ko|ko-KR">한국 (한국어)</option>
        </select>
        <div class="header-right">
          <button class="btn-speed" id="partner-spd" onclick="toggleSpeed('partner')">1.0x</button>
          <span class="badge-status" id="partner-badge">Pindutin para magsalita</span>
        </div>
      </div>

      <div class="chat-scroll" id="partner-chat"></div>

      <div class="input-row" onclick="event.stopPropagation()">
        <input type="text" id="partner-text" class="text-box" placeholder="Mag-type dito..." onkeypress="onEnter(event, 'partner')" />
        <button class="btn-send" id="partner-send-btn" onclick="sendDirect('partner')">Ipadala</button>
      </div>
    </div>

    <!-- 중앙: 광고 영역 -->
    <div class="ad-slot">
      <div class="ad-box">AD BANNER (320x50)</div>
    </div>

    <!-- 하단: 본인 영역 (정방향) -->
    <div class="panel user-panel" id="user-panel" onclick="onPanelTap(event, 'user')">
      <div class="header-bar" onclick="event.stopPropagation()">
        <select id="user-lang" class="select-lang" onchange="onLanguageChange('user')">
          <option value="ko|ko-KR" selected>본인: 한국어</option>
          <option value="en|en-US">본인: 영어</option>
          <option value="ja|ja-JP">본인: 일본어</option>
          <option value="zh-CN|zh-CN">본인: 중국어</option>
        </select>
        <div class="header-right">
          <button class="btn-speed" id="user-spd" onclick="toggleSpeed('user')">1.0x</button>
          <span class="badge-status" id="user-badge">터치하여 말하기</span>
        </div>
      </div>

      <div class="chat-scroll" id="user-chat"></div>

      <div class="input-row" onclick="event.stopPropagation()">
        <input type="text" id="user-text" class="text-box" placeholder="직접 입력 (한국어)..." onkeypress="onEnter(event, 'user')" />
        <button class="btn-send" id="user-send-btn" onclick="sendDirect('user')">전송</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // 각 언어별 UI 현지화 사전
    const UI_LOCALES = {
      'tl': {
        idle: 'Pindutin para magsalita',
        rec: 'Nakikinig... (Pindutin para ihinto)',
        placeholder: 'Mag-type dito...',
        send: 'Ipadala',
        replay: 'Pakinggan muli',
        welcomeMain: 'Kamusta! Pindutin ang screen para magsalita.',
        welcomeSub: 'Pindutin muli para ihinto.',
        startTime: 'Simula'
      },
      'ko': {
        idle: '터치하여 말하기',
        rec: '듣는 중... (터치 시 완료)',
        placeholder: '직접 입력 (한국어)...',
        send: '전송',
        replay: '다시듣기',
        welcomeMain: '안녕하세요! 화면을 터치하여 말씀하세요.',
        welcomeSub: '말하기를 마치려면 다시 터치하세요.',
        startTime: '시작'
      },
      'en': {
        idle: 'Tap to speak',
        rec: 'Listening... (Tap to finish)',
        placeholder: 'Type a message...',
        send: 'Send',
        replay: 'Replay',
        welcomeMain: 'Hello! Tap the screen to speak.',
        welcomeSub: 'Tap again to stop.',
        startTime: 'Start'
      },
      'ja': {
        idle: 'タップして話す',
        rec: '聞いています... (タップで停止)',
        placeholder: '直接入力...',
        send: '送信',
        replay: 'もう一度聞く',
        welcomeMain: 'こんにちは！画面をタップして話してください。',
        welcomeSub: '終了するにはもう一度タップします。',
        startTime: '開始'
      },
      'vi': {
        idle: 'Chạm để nói',
        rec: 'Đang nghe... (Chạm để dừng)',
        placeholder: 'Nhập tin nhắn...',
        send: 'Gửi',
        replay: 'Nghe lại',
        welcomeMain: 'Xin chào! Chạm vào màn hình để nói.',
        welcomeSub: 'Chạm lại để dừng nói.',
        startTime: 'Bắt đầu'
      },
      'th': {
        idle: 'แตะเพื่อพูด',
        rec: 'กำลังฟัง... (แตะเพื่อหยุด)',
        placeholder: 'พิมพ์ข้อความ...',
        send: 'ส่ง',
        replay: 'ฟังอีกครั้ง',
        welcomeMain: 'สวัสดี! แตะที่หน้าจอเพื่อพูด',
        welcomeSub: 'แตะอีกครั้งเพื่อหยุด',
        startTime: 'เริ่ม'
      },
      'es': {
        idle: 'Toca para hablar',
        rec: 'Escuchando... (Toca para parar)',
        placeholder: 'Escribe un mensaje...',
        send: 'Enviar',
        replay: 'Repetir',
        welcomeMain: '¡Hola! Toca la pantalla para hablar.',
        welcomeSub: 'Toca de nuevo para terminar.',
        startTime: 'Inicio'
      },
      'zh-CN': {
        idle: '点击说话',
        rec: '正在倾听... (点击停止)',
        placeholder: '输入消息...',
        send: '发送',
        replay: '重播',
        welcomeMain: '你好！点击屏幕开始说话。',
        welcomeSub: '再次点击结束说话。',
        startTime: '开始'
      }
    };

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognizer = null;
    let currentSpeaker = null;

    let partnerCode = 'tl', partnerTTS = 'tl-PH', pSpeed = 1.0;
    let userCode = 'ko', userTTS = 'ko-KR', uSpeed = 1.0;

    function getLocale(code) {
      return UI_LOCALES[code] || UI_LOCALES['en'];
    }

    function updatePanelUI(speaker) {
      const code = speaker === 'partner' ? partnerCode : userCode;
      const loc = getLocale(code);

      document.getElementById(`${speaker}-badge`).innerText = loc.idle;
      document.getElementById(`${speaker}-text`).placeholder = loc.placeholder;
      document.getElementById(`${speaker}-send-btn`).innerText = loc.send;
    }

    function onLanguageChange(speaker) {
      const p = document.getElementById('partner-lang').value.split('|');
      partnerCode = p[0]; partnerTTS = p[1];

      const u = document.getElementById('user-lang').value.split('|');
      userCode = u[0]; userTTS = u[1];

      updatePanelUI(speaker);
    }

    function initWelcomeCards() {
      const pLoc = getLocale(partnerCode);
      const uLoc = getLocale(userCode);

      addCard('partner-chat', pLoc.welcomeMain, pLoc.welcomeSub, pLoc.startTime, partnerTTS, pSpeed, partnerCode);
      addCard('user-chat', uLoc.welcomeMain, uLoc.welcomeSub, uLoc.startTime, userTTS, uSpeed, userCode);
    }

    function toggleSpeed(speaker) {
      if (speaker === 'partner') {
        pSpeed = pSpeed === 1.0 ? 0.8 : 1.0;
        document.getElementById('partner-spd').innerText = pSpeed + 'x';
      } else {
        uSpeed = uSpeed === 1.0 ? 0.8 : 1.0;
        document.getElementById('user-spd').innerText = uSpeed + 'x';
      }
    }

    async function initMic() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("HTTPS 연결이 필요합니다.");
        }
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());
        document.getElementById('overlay').style.display = 'none';
      } catch (e) {
        alert("마이크 권한을 허용해 주세요: " + e.message);
      }
    }

    function onPanelTap(e, speaker) {
      if (['INPUT', 'BUTTON', 'SELECT'].includes(e.target.tagName)) return;

      if (recognizer && currentSpeaker === speaker) {
        recognizer.stop();
        return;
      }
      if (recognizer) {
        recognizer.abort();
      }

      const lang = speaker === 'user' ? userTTS : partnerTTS;
      startSTT(lang, speaker);
    }

    function startSTT(lang, speaker) {
      if (!SpeechRecognition) {
        alert("브라우저 음성 인식이 지원되지 않습니다. Safari 또는 Chrome을 이용해 주세요.");
        return;
      }

      try {
        recognizer = new SpeechRecognition();
        currentSpeaker = speaker;
        recognizer.lang = lang;
        recognizer.interimResults = false;
        recognizer.maxAlternatives = 1;

        const panel = document.getElementById(`${speaker}-panel`);
        const badge = document.getElementById(`${speaker}-badge`);
        const code = speaker === 'partner' ? partnerCode : userCode;
        const loc = getLocale(code);

        panel.classList.add('recording');
        badge.innerText = loc.rec;

        recognizer.onresult = async (ev) => {
          const text = ev.results[0][0].transcript;
          await doTranslate(text, speaker);
        };

        recognizer.onerror = () => {};

        recognizer.onend = () => {
          panel.classList.remove('recording');
          badge.innerText = loc.idle;
          recognizer = null;
          currentSpeaker = null;
        };

        recognizer.start();
      } catch (err) {
        console.error(err);
      }
    }

    async function doTranslate(text, speaker) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if (speaker === 'user') {
        const trans = await fetchTranslate(text, userCode, partnerCode);
        addCard('partner-chat', trans, text, time, partnerTTS, pSpeed, partnerCode);
        addCard('user-chat', text, trans, time, userTTS, uSpeed, userCode);
        playVoice(trans, partnerTTS, pSpeed);
      } else {
        const trans = await fetchTranslate(text, partnerCode, userCode);
        addCard('user-chat', trans, text, time, userTTS, uSpeed, userCode);
        addCard('partner-chat', text, trans, time, partnerTTS, pSpeed, partnerCode);
        playVoice(trans, userTTS, uSpeed);
      }
    }

    function addCard(containerId, main, sub, time, ttsLang, speed, langCode) {
      const container = document.getElementById(containerId);
      const card = document.createElement('div');
      card.className = 'card';
      const clean = main.replace(/'/g, "\\'");
      const loc = getLocale(langCode);

      card.innerHTML = `
        <div class="txt-trans">${main}</div>
        <div class="txt-orig">${sub}</div>
        <div class="card-foot">
          <button class="btn-replay" onclick="event.stopPropagation(); playVoice('${clean}', '${ttsLang}', ${speed})">${loc.replay}</button>
          <span class="txt-time">${time}</span>
        </div>
      `;
      container.appendChild(card);
      container.scrollTop = container.scrollHeight;
    }

    function onEnter(e, speaker) {
      if (e.key === 'Enter') sendDirect(speaker);
    }

    async function sendDirect(speaker) {
      const inp = document.getElementById(`${speaker}-text`);
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      await doTranslate(txt, speaker);
    }

    async function fetchTranslate(text, sl, tl) {
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        return data[0].map(item => item[0]).join('');
      } catch (e) {
        return "[번역 실패] " + text;
      }
    }

    function playVoice(text, lang, speed = 1.0) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = lang;
      utt.rate = speed;
      window.speechSynthesis.speak(utt);
    }

    // 초기화
    updatePanelUI('partner');
    updatePanelUI('user');
    initWelcomeCards();
  </script>
</body>
</html>
